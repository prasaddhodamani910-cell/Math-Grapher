name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure mock google-services.json for CI
        run: |
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"0","project_id":"ci-test","storage_bucket":"ci.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.prasad.mathgrapher"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Run Lint
        run: ./gradlew lint

      - name: Run Build
        run: ./gradlew build
